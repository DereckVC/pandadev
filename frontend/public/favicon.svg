<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="purpleGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.85" />
    </filter>
  </defs>
  <!-- Contenedor redondeado oscuro con borde neón violeta -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#0d0d14" stroke="#8b5cf6" stroke-width="3.5" filter="url(#purpleGlow)" />
  <!-- Letra P con tipografía limpia y color lavanda centrado -->
  <text x="32" y="42" fill="#c4b5fd" font-size="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">P</text>
</svg>
